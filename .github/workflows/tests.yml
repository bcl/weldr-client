name: Linting and Unit Tests

# This makes sure only one action triggers the job
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.24.12"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "${{matrix.go}}"
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.3.0
      - name: Run lint checks on the source with Go ${{matrix.go}}
        run: make check

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.24.12"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: "${{matrix.go}}"
      - name: Run unit tests on Go ${{matrix.go}}
        run: make test

      - name: Send coverage to codecov.io
        if: ${{ matrix.go == '1.24.12' }}
        run: bash <(curl -s https://codecov.io/bash)

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.12"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run build test
        run: make build-in-podman
